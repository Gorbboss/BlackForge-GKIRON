name: Import GK Iron source and build Forge JAR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import latest upstream source
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/Grey3345/Forge-GKIron-1.20.X.git /tmp/gkiron-source
          rsync -a --exclude='.git' --exclude='.github/workflows' --exclude='build/' --exclude='.gradle/' /tmp/gkiron-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import latest GK Iron 1.20.1 source"
            git push
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Build Forge mod
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build
      - name: Upload compiled mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GK-Iron-Forge-1.20.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
